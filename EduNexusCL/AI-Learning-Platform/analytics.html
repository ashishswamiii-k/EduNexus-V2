<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — EduNexus</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="mobile-topbar" id="mobileTopbar"></div>
    <div class="content">
      <div class="topbar">
        <div>
          <div class="page-eyebrow">Class-Wide Data</div>
          <h1 class="page-title">Analytics</h1>
          <p class="page-sub">Performance patterns across the whole roster.</p>
        </div>
      </div>
      <div class="grid grid-2" style="align-items:start; margin-bottom:20px;">
        <div class="card chart-card">
          <div class="card-header"><div class="card-title">Average Score by Subject</div></div>
          <canvas id="subjectChart" height="160"></canvas>
        </div>
        <div class="card chart-card">
          <div class="card-header"><div class="card-title">Risk Distribution</div></div>
          <canvas id="riskChart" height="160"></canvas>
        </div>
      </div>
      <div class="card chart-card">
        <div class="card-header"><div class="card-title">Accuracy by Question Difficulty</div></div>
        <canvas id="difficultyChart" height="120"></canvas>
      </div>
    </div>
  </main>
</div>
<script src="data/topics.js"></script>
<script src="data/subjects.js"></script>
<script src="data/questions.js"></script>
<script src="data/students.js"></script>
<script src="data/teachers.js"></script>
<script src="data/seed.js"></script>
<script src="js/app.js"></script>
<script src="js/analysis.js"></script>
<script src="js/ai-engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.395.0/umd/lucide.min.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
