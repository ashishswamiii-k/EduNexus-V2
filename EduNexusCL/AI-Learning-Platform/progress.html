<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress — EduNexus</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="mobile-topbar" id="mobileTopbar"></div>
    <div class="content">
      <div class="topbar">
        <div>
          <div class="page-eyebrow">Analytics</div>
          <h1 class="page-title">Your Progress</h1>
          <p class="page-sub">Full topic-by-topic breakdown across every subject.</p>
        </div>
      </div>
      <div class="grid grid-4" id="progressKpis" style="margin-bottom:20px;"></div>
      <div class="card chart-card" style="margin-bottom:20px;">
        <div class="card-header"><div class="card-title">Accuracy Over Time</div></div>
        <canvas id="progressTrendChart" height="110"></canvas>
      </div>
      <div id="subjectBreakdown"></div>
    </div>
  </main>
</div>
<script src="data/topics.js"></script>
<script src="data/subjects.js"></script>
<script src="data/questions.js"></script>
<script src="data/students.js"></script>
<script src="data/teachers.js"></script>
<script src="data/seed.js"></script>
<script src="js/app.js"></script>
<script src="js/analysis.js"></script>
<script src="js/ai-engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.395.0/umd/lucide.min.js"></script>
<script src="js/progress.js"></script>
</body>
</html>
