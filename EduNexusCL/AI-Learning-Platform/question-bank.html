<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Bank — EduNexus</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="mobile-topbar" id="mobileTopbar"></div>
    <div class="content">
      <div class="topbar">
        <div>
          <div class="page-eyebrow">Content Library</div>
          <h1 class="page-title">Question Bank</h1>
          <p class="page-sub" id="qCountSub"></p>
        </div>
        <select id="subjectFilter" class="mono" style="padding:10px 14px; border-radius:10px; border:1px solid var(--border-strong); font-size:13px; background:var(--surface); color:var(--text-primary);">
          <option value="all">All Subjects</option>
        </select>
      </div>
      <div class="card"><div id="questionTable"></div></div>
    </div>
  </main>
</div>
<script src="data/topics.js"></script>
<script src="data/subjects.js"></script>
<script src="data/questions.js"></script>
<script src="data/students.js"></script>
<script src="data/teachers.js"></script>
<script src="data/seed.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.395.0/umd/lucide.min.js"></script>
<script src="js/question-bank.js"></script>
</body>
</html>
