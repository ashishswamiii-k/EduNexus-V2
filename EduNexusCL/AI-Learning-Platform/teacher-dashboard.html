<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Overview — EduNexus</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main>
    <div class="mobile-topbar" id="mobileTopbar"></div>
    <div class="content">

      <div class="topbar">
        <div>
          <div class="page-eyebrow">Class Overview</div>
          <h1 class="page-title" id="teacherGreeting">Welcome back 👋</h1>
          <p class="page-sub">Live view of every student's performance, weak topics, and risk level.</p>
        </div>
      </div>

      <div class="grid grid-4" id="classKpis" style="margin-bottom:20px;"></div>

      <div class="grid grid-2" style="margin-bottom:20px; align-items:start;">
        <div class="card chart-card">
          <div class="card-header"><div class="card-title">Risk Distribution</div></div>
          <canvas id="riskChart" height="160"></canvas>
        </div>
        <div class="card chart-card">
          <div class="card-header"><div class="card-title">Average Score by Subject</div></div>
          <canvas id="subjectAvgChart" height="160"></canvas>
        </div>
      </div>

      <div id="alertBannerMount" style="margin-bottom:20px;"></div>

      <div class="card" id="rosterSection">
        <div class="card-header">
          <div class="card-title">Student Roster</div>
          <div class="row" style="gap:8px;">
            <select id="riskFilter" class="mono" style="padding:8px 10px; border-radius:8px; border:1px solid var(--border-strong); font-size:12.5px;">
              <option value="all">All Risk Levels</option>
              <option value="High">High Risk</option>
              <option value="Medium">Medium Risk</option>
              <option value="Low">Low Risk</option>
            </select>
          </div>
        </div>
        <table>
          <thead>
            <tr><th>Student</th><th>Score</th><th>Weak Topic</th><th>Risk</th></tr>
          </thead>
          <tbody id="rosterBody"></tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<script src="data/topics.js"></script>
<script src="data/subjects.js"></script>
<script src="data/questions.js"></script>
<script src="data/students.js"></script>
<script src="data/teachers.js"></script>
<script src="data/seed.js"></script>
<script src="js/app.js"></script>
<script src="js/analysis.js"></script>
<script src="js/ai-engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.395.0/umd/lucide.min.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
